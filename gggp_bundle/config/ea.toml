# =====================================================================
# gggp_bundle/config/ea.toml
#
# Evolutionary algorithm hyperparameters for the A1 SCL PoC runner
# (scripts/run_A1.py).
#
# Every numeric has a matching *_range sibling documenting the
# evolutionarily-admissible search space (per user rule: constants
# influencing long computations must be declared with ranges so future
# meta-runs can GGGP-tune them).
# =====================================================================

[ea]
# --- Population and generations --------------------------------------
# pop_size affects wall time roughly linearly; n_generations affects
# linearly. Target wall time per seed: < 2 min on CPU.
pop_size = 50
pop_size_range = [20, 200]

n_generations = 30
n_generations_range = [10, 200]

# --- Genetic operators -----------------------------------------------
# Tournament selection size. k=1 == random, k=pop == best-always.
tournament_k = 3
tournament_k_range = [2, 7]

# Crossover probability per offspring slot.
p_crossover = 0.7
p_crossover_range = [0.0, 1.0]

# Per-gene mutation probability (applied to each of the chromosome's
# integer choices). With chromosome length ~25 this gives ~1.25
# mutations per offspring at the default 0.05.
p_mutation = 0.05
p_mutation_range = [0.0, 0.3]

# Elitism: how many top individuals survive unchanged to next gen.
# Keeps best F monotonic (important for log.jsonl continuity).
elitism = 2
elitism_range = [0, 10]

# --- Train/test split -------------------------------------------------
train_fraction = 0.8
train_fraction_range = [0.5, 0.9]

# --- Output rate -----------------------------------------------------
# Print a progress line every N generations.
log_every = 5
log_every_range = [1, 50]

[dims]
# Code and target dims are NOT evolutionary -- they're locked by the
# grammar files and by the embedding model. If you change them here,
# regenerate the grammars and re-embed the corpus.
code_dim = 16
target_dim = 1024

[chromosome]
# Max chromosome length for the chromosome-level crossover/mutation
# operators. Offspring exceeding this are truncated; shorter are fine.
# (Grammar's MaxDepth=24 already caps tree depth; this is a belt-and-
# braces bound on the flat gene array.)
max_gene_count = 96
max_gene_count_range = [16, 256]

# Max resample attempts when an operator produces a grammar-invalid
# chromosome. After this many failures we fall back to
# random_chromosome(seed=fresh) instead.
max_resample_attempts = 8
max_resample_attempts_range = [1, 64]
